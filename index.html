<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доставка History</title>
  <meta name="description" content="Доставка еды и продуктов из проверенных халяль-заведений Махачкалы и Каспийска.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=2">
  <link rel="stylesheet" href="style.css?v=61">
</head>
<body>
  <header class="header">
    <div class="header-in">
      <a class="brand" href="#/" aria-label="Доставка History — на главную">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span class="brand-text">Доставка<br>History</span>
      </a>
      <button class="address-btn" id="addressButton" type="button">
        <span class="address-icon" aria-hidden="true">📍</span>
        <span class="address-text"><b id="cityLabel">Город</b><small id="addressLabel">Укажите адрес доставки</small></span>
      </button>
      <label class="header-search">
        <span aria-hidden="true">🔍</span>
        <input id="search" type="search" placeholder="Найти заведение или блюдо" aria-label="Поиск" autocomplete="off">
      </label>
      <a class="header-link" href="#/orders"><span aria-hidden="true">🧾</span><span class="header-link-text">Заказы</span></a>
      <button class="cart-button" id="cartButton" type="button" aria-label="Корзина">
        <span aria-hidden="true">🛒</span>
        <span id="cartSum">Корзина</span>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <!-- Плашка корзины на телефоне -->
  <button class="cart-bar" id="cartBar" type="button" hidden>
    <span class="cart-bar-count" id="cartBarCount">0</span>
    <span>Корзина</span>
    <b id="cartBarSum">0 ₽</b>
  </button>

  <!-- Корзина -->
  <div class="overlay" id="cartOverlay" hidden></div>
  <aside class="drawer" id="cartDrawer" aria-label="Корзина" hidden>
    <button class="icon-btn drawer-close" id="cartClose" type="button" aria-label="Закрыть">✕</button>
    <div class="drawer-body" id="cartBody"></div>
  </aside>

  <!-- Выбор адреса: поиск или пин на карте -->
  <dialog class="modal modal-picker" id="addressModal" tabindex="-1">
    <button class="icon-btn modal-close" type="button" data-close-modal aria-label="Закрыть">✕</button>
    <h2 id="pickerTitle">Куда доставить?</h2>
    <div class="segmented" id="cityGrid" role="group" aria-label="Город"></div>
    <form id="addressForm" class="picker" novalidate>
      <div class="picker-side">
        <label class="header-search picker-search"><span aria-hidden="true">🔍</span>
          <input id="pickerSearch" type="search" placeholder="Улица и дом" aria-label="Поиск адреса" autocomplete="off"></label>
        <div class="suggest" id="pickerSuggest"></div>
        <div class="saved" id="pickerSaved"></div>
      </div>
      <div class="picker-map-wrap">
        <div class="map" id="pickerMap"></div>
        <div class="center-pin" aria-hidden="true"><span></span></div>
        <button class="icon-btn locate-btn" type="button" id="pickerLocate" aria-label="Моё местоположение">◎</button>
      </div>
      <div class="picker-picked" id="pickerPicked"></div>
      <div class="picker-details" id="pickerDetails">
        <div class="row4">
          <div class="field"><label for="a-flat">Кв./офис</label><input id="a-flat" name="flat"></div>
          <div class="field"><label for="a-entrance">Подъезд</label><input id="a-entrance" name="entrance"></div>
          <div class="field"><label for="a-floor">Этаж</label><input id="a-floor" name="floor"></div>
          <div class="field"><label for="a-intercom">Домофон</label><input id="a-intercom" name="intercom"></div>
        </div>
        <div class="field"><label for="a-courier">Комментарий курьеру</label><input id="a-courier" name="courier" placeholder="Например, вход со двора"></div>
        <div class="tag-row"><span class="muted">Сохранить как</span>
          <button class="pill" type="button" data-tag="home" aria-pressed="false">🏠 Дом</button>
          <button class="pill" type="button" data-tag="work" aria-pressed="false">💼 Работа</button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Готово</button>
    </form>
  </dialog>

  <!-- Откуда забрать: только заведения из каталога -->
  <dialog class="modal modal-picker" id="placeModal" tabindex="-1">
    <button class="icon-btn modal-close" type="button" data-close-modal aria-label="Закрыть">✕</button>
    <h2 id="placePickerTitle">Откуда забрать?</h2>
    <p class="hint place-pick-hint">Доставляем только из заведений нашего каталога.</p>
    <div class="segmented" id="placeCityGrid" role="group" aria-label="Город"></div>
    <div class="picker place-picker">
      <div class="picker-side">
        <label class="header-search picker-search"><span aria-hidden="true">🔍</span>
          <input id="placeSearch" type="search" placeholder="Название или адрес" aria-label="Поиск заведения" autocomplete="off"></label>
        <div id="placeList"></div>
      </div>
      <div class="picker-map-wrap"><div class="map" id="placeMap"></div></div>
      <div class="picker-picked" id="placePicked"></div>
      <button class="btn btn-primary btn-block" type="button" id="placeDone">Готово</button>
    </div>
  </dialog>

  <!-- Карточка блюда -->
  <dialog class="modal modal-dish" id="dishModal" tabindex="-1">
    <button class="icon-btn modal-close" type="button" data-close-modal aria-label="Закрыть">✕</button>
    <div id="dishBody"></div>
  </dialog>

  <!-- Информация о заведении -->
  <dialog class="modal" id="infoModal">
    <button class="icon-btn modal-close" type="button" data-close-modal aria-label="Закрыть">✕</button>
    <div id="infoBody"></div>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <footer class="footer">
    <div class="footer-in">
      <span>© Доставка History</span>
      <a href="driver/" class="footer-link">Для водителей и курьеров →</a>
    </div>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="config.js?v=9"></script>
  <script src="data/places.js?v=30"></script>
  <script src="data/menus.js?v=2"></script>
  <script src="data/menus-manual.js?v=35"></script>
  <script src="map.js?v=46"></script>
  <script src="delivery.js?v=62"></script>
  <script src="bus.js?v=50"></script>
  <script src="app.js?v=64"></script>
</body>
</html>
