<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Халяль Доставка</title>
  <meta name="description" content="Доставка еды и продуктов из проверенных халяль-заведений Махачкалы и Каспийска.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=2">
  <link rel="stylesheet" href="style.css?v=36">
</head>
<body>
  <header class="header">
    <div class="header-in">
      <a class="brand" href="#/" aria-label="Халяль Доставка — на главную">
        <span class="brand-mark" aria-hidden="true">Х</span>
        <span class="brand-text">Халяль<br>Доставка</span>
      </a>
      <button class="address-btn" id="addressButton" type="button">
        <span class="address-icon" aria-hidden="true">📍</span>
        <span class="address-text"><b id="cityLabel">Город</b><small id="addressLabel">Укажите адрес доставки</small></span>
      </button>
      <label class="header-search">
        <span aria-hidden="true">🔍</span>
        <input id="search" type="search" placeholder="Найти заведение или блюдо" aria-label="Поиск" autocomplete="off">
      </label>
      <a class="header-link" href="#/orders"><span aria-hidden="true">🧾</span><span class="header-link-text">Заказы</span></a>
      <button class="cart-button" id="cartButton" type="button" aria-label="Корзина">
        <span aria-hidden="true">🛒</span>
        <span id="cartSum">Корзина</span>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <!-- Плашка корзины на телефоне -->
  <button class="cart-bar" id="cartBar" type="button" hidden>
    <span class="cart-bar-count" id="cartBarCount">0</span>
    <span>Корзина</span>
    <b id="cartBarSum">0 ₽</b>
  </button>

  <!-- Корзина -->
  <div class="overlay" id="cartOverlay" hidden></div>
  <aside class="drawer" id="cartDrawer" aria-label="Корзина" hidden>
    <button class="icon-btn drawer-close" id="cartClose" type="button" aria-label="Закрыть">✕</button>
    <div class="drawer-body" id="cartBody"></div>
  </aside>

  <!-- Адрес и город -->
  <dialog class="modal" id="addressModal">
    <button class="icon-btn modal-close" type="button" data-close-modal aria-label="Закрыть">✕</button>
    <h2>Адрес доставки</h2>
    <div class="segmented" id="cityGrid" role="group" aria-label="Город"></div>
    <form id="addressForm" class="form" novalidate>
      <div class="field"><label for="a-street">Улица и дом</label><input id="a-street" name="address" autocomplete="street-address" placeholder="Например, проспект Гамидова, 12"></div>
      <div class="row3">
        <div class="field"><label for="a-flat">Кв./офис</label><input id="a-flat" name="flat"></div>
        <div class="field"><label for="a-entrance">Подъезд</label><input id="a-entrance" name="entrance"></div>
        <div class="field"><label for="a-floor">Этаж</label><input id="a-floor" name="floor"></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Сохранить</button>
    </form>
  </dialog>

  <!-- Карточка блюда -->
  <dialog class="modal modal-dish" id="dishModal" tabindex="-1">
    <button class="icon-btn modal-close" type="button" data-close-modal aria-label="Закрыть">✕</button>
    <div id="dishBody"></div>
  </dialog>

  <!-- Информация о заведении -->
  <dialog class="modal" id="infoModal">
    <button class="icon-btn modal-close" type="button" data-close-modal aria-label="Закрыть">✕</button>
    <div id="infoBody"></div>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <footer class="footer">
    <div class="footer-in">
      <span>© Халяль Доставка</span>
      <span>Заведения — из каталога Halal Tracker. Часть меню — с Яндекс Еды и от самих заведений, остальные демонстрационные.</span>
    </div>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="config.js?v=8"></script>
  <script src="data/places.js?v=30"></script>
  <script src="data/menus.js"></script>
  <script src="data/menus-yandex.js?v=12"></script>
  <script src="data/menus-manual.js?v=35"></script>
  <script src="map.js?v=30"></script>
  <script src="app.js?v=36"></script>
</body>
</html>
