<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка динамического коэффициента — Махачкала</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6EAEC;--panel:#F6F7F7;--ink:#1C252B;--muted:#56636B;--line:#C6CED3;--accent:#1D6C75;--warn:#9A5B00;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141A1E;--panel:#1D252B;--ink:#E4EAED;--muted:#97A4AB;--line:#34414A;--accent:#62B9C1;--warn:#F1B23B;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:minmax(0,1fr) 390px;background:var(--bg);color:var(--ink);font-family:Onest,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
#map{height:100%;min-height:320px}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:22px 22px 32px}
h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin:0 0 6px}
.lead{color:var(--muted);font-size:.92rem;margin:0 0 20px}
.k{font-size:clamp(3.4rem,9vw,4.6rem);font-weight:800;line-height:1;letter-spacing:-.03em}
.note{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.price{font-size:2rem;font-weight:800;margin-top:18px;line-height:1.1}
.rows{margin:10px 0 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:.93rem}
.row span:first-child{color:var(--muted)}
.box{margin-top:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:.88rem}
.empty{color:var(--muted);font-size:.95rem;padding:10px 0 4px}
.warn{color:var(--warn);font-size:.88rem;margin:10px 0 0}
.busy{color:var(--muted);font-size:.95rem;padding:10px 0}
.line{margin-top:14px}
button{font:inherit;font-size:.9rem;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;margin-top:22px}
.check input{accent-color:var(--accent);width:18px;height:18px}
.legend{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#A3CEC8,#F1B23B,#C53C2E)}
details{margin-top:24px;font-size:.85rem}
summary{cursor:pointer;font-weight:600}
pre{overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.78rem;line-height:1.4}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ink);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin b{transform:rotate(45deg);color:#fff;font:700 13px Onest,Arial,sans-serif}
.pin.to{background:var(--accent)}
@media (max-width:820px){body{grid-template-columns:1fr;grid-template-rows:55vh auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Карта Махачкалы: нажмите, чтобы поставить точки маршрута"></div>
<aside>
  <h1>Проверка цены доставки</h1>
  <p class="lead">Нажмите на карту два раза: сначала откуда забрать, потом куда везти. Маршрут, пробки и цена считаются тем же кодом, что и на сайте (delivery.js).</p>
  <div id="result" aria-live="polite"></div>
  <div class="line"><button type="button" id="reset" hidden>Новый маршрут</button></div>
  <label class="check"><input type="checkbox" id="zones" checked> Показать зоны на карте</label>
  <div class="legend"><span>×1,0</span><i></i><span>×3,0</span></div>
  <details>
    <summary>Что вернул расчёт</summary>
    <pre id="raw">Постройте маршрут на карте.</pre>
  </details>
</aside>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="config.js?v=9"></script>
<script src="surge-engine.js?v=1"></script>
<script src="delivery.js?v=70"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var fmt=function(x,d){return x.toFixed(d).replace(".",",")};
  var rub=function(x){return Math.round(x).toLocaleString("ru-RU")+" ₽"};
  var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var DL=window.DostavkaDelivery, engine=DL&&DL.surgeEngine;
  if(!DL||!engine){
    $("result").innerHTML='<p class="warn">Не подключены surge-engine.js и delivery.js. Положите их в ту же папку, что и эту страницу.</p>';
    return;
  }
  var cfg=window.DOSTAVKA_CONFIG||{};
  var keysNote=!cfg.twoGisKey&&!cfg.yandexMapsKey?"Ключи 2ГИС и Яндекса не найдены: маршрут считается по прямой, пробки не учитываются. Проверьте, что в config.js заданы twoGisKey или yandexMapsKey.":"";
  var T=DL.TARIFFS.courier;

  var map=L.map("map").setView([42.975,47.49],13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; участники OpenStreetMap"}).addTo(map);
  var zoneLayer=L.layerGroup().addTo(map);
  var A=null,B=null,mA=null,mB=null,line=null,last=null,reqId=0,zonesState=null;
  function pin(t,cls){return L.divIcon({className:"",html:'<div class="pin '+(cls||"")+'"><b>'+t+'</b></div>',iconSize:[30,30],iconAnchor:[15,30]})}

  var STOPS=[[0,[163,206,200]],[0.5,[241,178,59]],[1,[197,60,46]]];
  function color(k){var t=Math.max(0,Math.min(1,(k-1)/(engine.config.model.kmax-1))),a=STOPS[0],b=STOPS[1];if(t>0.5){a=STOPS[1];b=STOPS[2]}
    var u=(t-a[0])/(b[0]-a[0]);return "rgb("+a[1].map(function(v,i){return Math.round(v+(b[1][i]-v)*u)}).join(",")+")"}
  function drawZones(){
    zoneLayer.clearLayers();
    var st=zonesState||{date:new Date(),weather:DL.weather().key,trafficScore:0};
    if(!$("zones").checked) return;
    engine.zones(st).forEach(function(z){
      L.polygon(z.polygon,{stroke:false,fillColor:color(z.k),fillOpacity:z.k>1.001?.45:.12,interactive:false}).addTo(zoneLayer);
    });
  }
  $("zones").addEventListener("change",drawZones);
  drawZones(); setTimeout(function(){ if(!zonesState) drawZones(); },2500); // перерисовать, когда загрузится погода

  // Город точки — как на сайте, из адреса 2ГИС; без ключа — приблизительно по расстоянию до Каспийска.
  var KASPIYSK={lat:42.8816,lon:47.6385};
  function cityGuess(c){var dy=(c[0]-KASPIYSK.lat)*110.57,dx=(c[1]-KASPIYSK.lon)*111.32*Math.cos(c[0]*Math.PI/180);return Math.hypot(dx,dy)<6?"Каспийск":"Махачкала"}
  function cityFor(c){
    if(!DL.hasGeo()) return Promise.resolve(cityGuess(c));
    return DL.reverse(c).then(function(x){return (x&&x.city)||cityGuess(c)}).catch(function(){return cityGuess(c)});
  }

  map.on("click",function(e){
    if(!A||B){ reset(); A=[e.latlng.lat,e.latlng.lng]; mA=L.marker(e.latlng,{icon:pin("А")}).addTo(map); show(); }
    else { B=[e.latlng.lat,e.latlng.lng]; mB=L.marker(e.latlng,{icon:pin("Б","to")}).addTo(map); calculate(); }
  });
  function reset(){ [mA,mB,line].forEach(function(l){if(l)map.removeLayer(l)}); A=B=mA=mB=line=last=null; reqId++; show(); }
  $("reset").addEventListener("click",reset);

  function calculate(){
    var id=++reqId; show("busy");
    Promise.all([DL.route(A,B,{traffic:true}),cityFor(A),cityFor(B)]).then(function(res){
      if(id!==reqId) return;
      var r=res[0], intercity=res[1]!==res[2];
      var p=DL.price("courier",r.distance,{durationS:r.duration,jamS:r.jamS,from:A,intercity:intercity});
      last={r:r,p:p,cities:[res[1],res[2]]};
      if(r.path&&r.path.length>1){ line=L.polyline(r.path,{color:getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#1D6C75",weight:5,opacity:.9}).addTo(map); map.fitBounds(line.getBounds(),{padding:[40,40]}); }
      zonesState={date:new Date(),weather:DL.weather().key,trafficScore:(p.surgeInfo&&p.surgeInfo.trafficScore)||0,trafficIsLive:true}; drawZones();
      show();
    }).catch(function(err){ if(id!==reqId) return; show("error",err.message); });
  }

  function trafficSource(r,p){
    if(r.source==="estimate") return "нет данных";
    return p.jamSource==="yandex"?"Яндекс Карты":"2ГИС";
  }

  function show(state,msg){
    var box=$("result"); $("reset").hidden=!A;
    if(state==="busy"){ box.innerHTML='<p class="busy">Считаю маршрут, пробки и цену…</p>'; return; }
    if(state==="error"){ box.innerHTML='<p class="warn">Не удалось посчитать: '+esc(msg)+'.</p>'; return; }
    if(!A){ box.innerHTML='<p class="empty">Поставьте на карте точку, откуда забрать.</p>'+(keysNote?'<p class="warn">'+esc(keysNote)+'</p>':''); $("raw").textContent="Постройте маршрут на карте."; return; }
    if(!last){ box.innerHTML='<p class="empty">Теперь нажмите, куда везти.</p>'; return; }
    var r=last.r, p=last.p, s=p.surgeInfo||{}, w=DL.weather();
    var plain=Math.round((p.base+p.kmPart)/10)*10;
    var h='<div class="k">×'+fmt(p.surge,1)+'</div><p class="note">'+
      (!s.auto?"Коэффициент не рассчитан, взят запасной.":s.outsideArea?"Точка подачи вне зоны расчёта, повышения нет.":"Коэффициент в зоне подачи, "+String(s.period||"").toLowerCase()+".")+'</p>';
    h+='<div class="price">'+rub(p.ride+p.waitPart)+'</div><div class="rows">'+
      '<div class="row"><span>Подача</span><span>'+rub(p.base)+'</span></div>'+
      '<div class="row"><span>'+fmt(p.km,1)+' км × '+p.rate+' ₽'+(p.intercity?' (между городами)':'')+'</span><span>'+rub(p.kmPart)+'</span></div>'+
      '<div class="row"><span>Динамический коэффициент × '+fmt(p.surge,1)+'</span><span>'+rub(p.raw)+'</span></div>'+
      '<div class="row"><span>Поездка, с округлением до 10 ₽</span><span>'+rub(p.ride)+'</span></div>'+
      (p.waitPart?'<div class="row"><span>Ожидание: '+p.paidWaitMin+' мин × '+T.waitPerMin+' ₽</span><span>'+rub(p.waitPart)+'</span></div>':'')+
      '<div class="row"><span>Без повышения было бы</span><span>'+rub(plain)+'</span></div>'+
      '<div class="row"><span>В пути</span><span>~'+p.minutes+' мин'+(r.source==="estimate"?" (по прямой)":"")+'</span></div>'+
      '<div class="row"><span>Пробки</span><span>'+(r.source==="estimate"?"не учтены":(s.trafficScore||0)+" из 10, +"+p.jamMin+" мин ("+trafficSource(r,p)+")")+'</span></div>'+
      '<div class="row"><span>Погода</span><span>'+(w.at?(w.tempC>0?"+":"")+Math.round(w.tempC)+"°, ":"")+String(s.weather||"нет данных").toLowerCase()+'</span></div></div>';
    if(s.prayer&&s.prayer.isFriday) h+='<div class="box">Пятница: зухр в '+s.prayer.zuhr+', пробки у мечетей с '+s.prayer.from+' до '+s.prayer.to+'.'+(s.prayer.intensity>=1?" Сейчас внутри окна.":s.prayer.intensity>0?" Край окна: влияние "+Math.round(s.prayer.intensity*100)+"%.":" Сейчас вне окна.")+'</div>';
    h+='<p class="note">'+T.freeWaitMin+' мин ожидания бесплатно, дальше '+T.waitPerMin+' ₽/мин.</p>';
    if(keysNote) h+='<p class="warn">'+esc(keysNote)+'</p>';
    box.innerHTML=h;
    $("raw").textContent=JSON.stringify({price:p,route:{source:r.source,distance:r.distance,duration:r.duration,jamS:r.jamS},cities:last.cities,weather:w},null,2);
  }
  show();
})();
</script>
</body>
</html>
